name: Markdown 语义与视觉对照验证

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "执行的数据源（逗号分隔：commonmark,cmark-gfm；或 all）"
        type: string
        required: true
        default: "all"
      create_issue:
        description: "失败后创建或更新 Issue"
        type: boolean
        default: true
      run_visual:
        description: "执行浏览器视觉对照测试"
        type: boolean
        default: true
      fail_workflow:
        description: "存在未通过用例时将工作流标记为失败"
        type: boolean
        default: true
      issue_repository:
        description: "Issue 目标仓库（owner/repo，留空使用当前仓库）"
        type: string
        default: ""
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/markdown-conformance.yml"
      - "tests/cases/**"
      - "tests/markdown-conformance/**"
      - "crates/supramark-markdown/**"
      - "packages/core/**"
      - "packages/renderers/web/**"
  # Same paths as the push trigger, so a PR that can change conformance is
  # checked before it merges rather than after. Without this, the workflow
  # only ever ran post-merge: #121 landed a parser change that broke
  # tests/public_api.rs, main went red, and nothing had told the PR.
  #
  # The issue-filing step already carries a `github.event_name !=
  # 'pull_request'` guard (dead until now), so PR runs report through the
  # check and the run artifacts, and never open or update an issue.
  pull_request:
    paths:
      - ".github/workflows/markdown-conformance.yml"
      - "tests/cases/**"
      - "tests/markdown-conformance/**"
      - "crates/supramark-markdown/**"
      - "packages/core/**"
      - "packages/renderers/web/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: markdown-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-sources:
    name: 解析待测试数据源
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.resolve.outputs.sources }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 校验并解析数据源
        id: resolve
        env:
          REQUESTED_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.sources || vars.MARKDOWN_CONFORMANCE_SOURCES || 'all' }}
        shell: bash
        run: |
          sources="$(node tests/markdown-conformance/scripts/resolve-sources.mjs "$REQUESTED_SOURCES")"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "selected_sources=$sources"

  markdown-conformance:
    name: ${{ matrix.source }} 语义与视觉对照
    needs: resolve-sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.resolve-sources.outputs.sources) }}
    env:
      SOURCE_NAME: ${{ matrix.source }}
      CREATE_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_issue || (github.event_name != 'workflow_dispatch' && vars.MARKDOWN_CONFORMANCE_AUTO_ISSUE != 'false' && vars.COMMONMARK_AUTO_ISSUE != 'false') }}
      RUN_VISUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual || (github.event_name != 'workflow_dispatch' && vars.MARKDOWN_CONFORMANCE_RUN_VISUAL != 'false' && vars.COMMONMARK_RUN_VISUAL != 'false') }}
      FAIL_WORKFLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.fail_workflow || (github.event_name != 'workflow_dispatch' && vars.MARKDOWN_CONFORMANCE_FAIL_WORKFLOW != 'false' && vars.COMMONMARK_FAIL_WORKFLOW != 'false') }}
      ISSUE_REPOSITORY: ${{ inputs.issue_repository || vars.MARKDOWN_CONFORMANCE_ISSUE_REPOSITORY || vars.COMMONMARK_ISSUE_REPOSITORY || github.repository }}

    steps:
      - name: 显示运行配置
        run: |
          echo "source=$SOURCE_NAME"
          echo "create_issue=$CREATE_ISSUE"
          echo "run_visual=$RUN_VISUAL"
          echo "fail_workflow=$FAIL_WORKFLOW"
          echo "issue_repository=$ISSUE_REPOSITORY"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: 安装用例依赖
        working-directory: tests/markdown-conformance
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright Chromium
        if: env.RUN_VISUAL == 'true'
        working-directory: tests/markdown-conformance
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: 导入锁定的数据源
        run: node tests/markdown-conformance/scripts/import.mjs "$SOURCE_NAME"

      - name: 校验统一 JSON 用例
        run: node tests/markdown-conformance/scripts/validate.mjs "$SOURCE_NAME"

      - name: 检查导入产物可重复
        run: git diff --exit-code -- "tests/cases/_fixtures/$SOURCE_NAME/"

      - name: 运行 Markdown parser 回归测试
        run: cargo test -p supramark-markdown --test public_api

      - name: 构建 Supramark Markdown CLI
        run: cargo build -p supramark-markdown --bin supramark-markdown

      - name: 执行语义与视觉对照
        id: conformance_test
        continue-on-error: true
        env:
          FAIL_ON_FAILURES: "1"
        shell: bash
        run: |
          if [ "$RUN_VISUAL" = "true" ]; then
            node tests/markdown-conformance/scripts/run-visual.mjs "$SOURCE_NAME"
          else
            node tests/markdown-conformance/scripts/run.mjs "$SOURCE_NAME"
          fi

      - name: 上传中文报告与失败详情
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-conformance-${{ matrix.source }}
          path: tests/markdown-conformance/artifacts/${{ matrix.source }}/
          if-no-files-found: error
          retention-days: 30

      - name: 自动创建或更新失败 Issue
        if: steps.conformance_test.outcome == 'failure' && github.event_name != 'pull_request' && env.CREATE_ISSUE == 'true'
        env:
          GH_TOKEN: ${{ secrets.MARKDOWN_CONFORMANCE_ISSUE_TOKEN || secrets.COMMONMARK_ISSUE_TOKEN || github.token }}
          GH_REPO: ${{ env.ISSUE_REPOSITORY }}
          ISSUE_BODY: tests/markdown-conformance/artifacts/${{ matrix.source }}/issue.md
          ISSUE_METADATA: tests/markdown-conformance/artifacts/${{ matrix.source }}/issue-metadata.json
        shell: bash
        run: |
          mapfile -t issue_metadata < <(
            node -e '
              const fs = require("node:fs");
              const metadata = JSON.parse(
                fs.readFileSync(process.env.ISSUE_METADATA, "utf8")
              );
              process.stdout.write([
                metadata.source,
                metadata.title,
                metadata.labels.join(","),
                metadata.marker,
              ].join("\n"));
            '
          )
          issue_source="${issue_metadata[0]}"
          issue_title="${issue_metadata[1]}"
          issue_labels="${issue_metadata[2]}"
          issue_marker="${issue_metadata[3]}"

          if [ -z "$issue_source" ] || [ -z "$issue_title" ] || [ -z "$issue_labels" ] || [ -z "$issue_marker" ]; then
            echo "Issue 元数据不完整，无法创建或更新 Issue。"
            exit 1
          fi

          existing_labels="$(
            gh label list \
              --repo "$GH_REPO" \
              --limit 1000 \
              --json name \
              --jq '.[].name'
          )"
          IFS=',' read -ra issue_label_names <<< "$issue_labels"
          for issue_label in "${issue_label_names[@]}"; do
            issue_label="$(printf '%s' "$issue_label" | xargs)"
            if [ -z "$issue_label" ]; then
              continue
            fi
            if ! grep -Fqx -- "$issue_label" <<< "$existing_labels"; then
              if ! gh label create "$issue_label" \
                --repo "$GH_REPO" \
                --color "d73a4a" \
                --description "测试发现需要修复的问题"; then
                if ! gh label list \
                  --repo "$GH_REPO" \
                  --limit 1000 \
                  --json name \
                  --jq '.[].name' \
                  | grep -Fqx -- "$issue_label"; then
                  echo "无法创建或确认 Issue 标签：$issue_label"
                  exit 1
                fi
                echo "Issue 标签已由并行任务创建：$issue_label"
              fi
            fi
          done

          issue_number="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --json number,title,body \
              | jq -r \
                  --arg title "$issue_title" \
                  --arg marker "$issue_marker" \
                  '.[] | select(.title == $title or ((.body // "") | contains($marker))) | .number' \
              | head -n 1
          )"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GH_REPO" \
              --title "$issue_title" \
              --body-file "$ISSUE_BODY" \
              --add-label "$issue_labels"
            echo "已更新 $issue_source Issue #$issue_number：$issue_title"
          else
            issue_url="$(
              gh issue create \
                --repo "$GH_REPO" \
                --title "$issue_title" \
                --body-file "$ISSUE_BODY" \
                --label "$issue_labels"
            )"
            echo "已创建 $issue_source Issue：$issue_url"
          fi

      - name: 标记语义或视觉对照失败
        if: always() && steps.conformance_test.outcome == 'failure' && env.FAIL_WORKFLOW == 'true'
        run: |
          echo "$SOURCE_NAME 语义或视觉对照存在未通过用例，中文报告和 Issue 内容已生成。"
          exit 1
